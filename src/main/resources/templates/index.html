<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>My First Sping Boot Project</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">


    </head>
    <body>
        <main class="page-container">

    <section class="greeting-card">

        <p class="project-label">SPRING BOOT PROJECT</p>

        <h1>Welcome to My First Project</h1>

        <p class="description">
            Enter your name to receive a personalized greeting.
        </p>

        <form th:action="@{/greet}" method="post">

            <label for="name">Your name</label>

            <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                    autofocus>

            <p class="error-message"
               th:if="${error}"
               th:text="${error}">
            </p>

            <button type="submit">
                Show Greeting
            </button>

        </form>

    </section>

</main>
    </body>
</html>
